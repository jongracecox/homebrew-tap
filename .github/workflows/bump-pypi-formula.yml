name: bump-pypi-formula

# Run by hand after publishing a Python tool to PyPI.
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bump (its PyPI project must have the same name)
        required: true
        default: mdpeek
      version:
        description: Version to bump to (blank = latest on PyPI)
        required: false

permissions:
  contents: write

concurrency: bump-formula

env:
  TAP: jongracecox/tap
  FORMULA: ${{ inputs.formula }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use this checkout as the tap
        run: |
          taps="$(brew --repository)/Library/Taps/jongracecox"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      - name: Update formula
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/bump-pypi-formula.sh "$TAP" "$FORMULA" "$VERSION"

      - name: Build, test and audit
        if: steps.bump.outputs.changed == 'true'
        run: |
          brew install --build-from-source "$TAP/$FORMULA"
          brew test "$TAP/$FORMULA"
          brew audit --strict --online "$TAP/$FORMULA"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA.rb"
          git commit -m "$FORMULA $VERSION"
          git push
